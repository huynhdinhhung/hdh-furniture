name: Hưng Furniture quality
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral
          POSTGRES_DB: furniture_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d furniture_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_ephemeral@localhost:5432/furniture_ci
      TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral@localhost:5432/furniture_test_ci
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Seed test catalog for browser tests
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:ci_ephemeral@localhost:5432/furniture_test_ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:ci_ephemeral@localhost:5432/furniture_test_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          retention-days: 7
  containers:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t hung-api:ci .
      - run: docker build -f apps/web/Dockerfile -t hung-web:ci .
