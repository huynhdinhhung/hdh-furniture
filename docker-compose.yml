services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: furniture_app
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD privately in .env}
      POSTGRES_DB: furniture_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniture_app -d furniture_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL with host db and port 5432}
    command: ["npm", "run", "db:deploy"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL}
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      SHIPPING_FEE_VND: ${SHIPPING_FEE_VND:-50000}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_HOLDER: ${BANK_HOLDER:-}
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/api/uploads
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  uploads:
  pgdata:
